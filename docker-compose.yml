version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ayunet-postgres
    restart: always
    environment:
      POSTGRES_USER: ayunet_admin
      POSTGRES_PASSWORD: ayunet_secure_password
      POSTGRES_DB: ayunet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayunet_admin -d ayunet_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ayunet-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayunet-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://ayunet_admin:ayunet_secure_password@postgres:5432/ayunet_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "ayunet_super_secret_jwt_key_2026"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
